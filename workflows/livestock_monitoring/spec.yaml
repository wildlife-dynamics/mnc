id: livestock_monitoring
requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mnc
    version: "*"
    channel: "file:///tmp/ecoscope-workflows-custom/release/artifacts/"
    
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

task-instance-defaults:
  skipif:
    conditions: 
      - any_is_empty_df 
      - any_dependency_skipped 

workflow:
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time Range
    id: time_range
    task: set_time_range
      
  - name: Set Groupers
    id: groupers
    task: set_groupers
    partial: 
      groupers: []

  - name: Connect to EarthRanger
    id: er_client_name
    task: set_er_connection

  - name: Configure base map layers
    id: configure_base_maps
    task: set_base_maps_pydeck
    partial:
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 1
          max_zoom: 20

  - name: Download MNC community conservancy boundaries
    id: persist_mnc_gpkg
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/14rcy4lkwp7xgewj3xf7k/mnc_conservancy.gpkg?rlkey=mtqo7ivxrnvjonm2z1zez6h6f&st=gtdi4vv0&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name: Download MNC Parcels gpkg
    id: download_mnc_parcels
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/33rdzy896rh91gtkfs2j3/mnc_across_the_river_parcels.gpkg?rlkey=xima1v0rozc0h9h78esfogx6q&st=o3gkk5p1&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name : Load community conservancy boundaries
    id: load_comm_shp
    task: load_df
    partial:
      file_path: ${{ workflow.persist_mnc_gpkg.return }}
      layer: null
      deserialize_json: false

  - name: Fix invalid geometries in community boundaries
    id: fix_comm_geom
    task: ecoscope_workflows_ext_mnc.tasks.transformation.fix_invalid_geometries
    partial:
      gdf: ${{ workflow.load_comm_shp.return }}

  - name: Filter conservancy boundary only
    id: filter_conservancy_boundary
    task: filter_df
    partial:
      df: ${{ workflow.fix_comm_geom.return }}
      column_name: grazing_zone
      op: equal
      value: Conservancy
      reset_index: true

  - name: Filter to Mara North Conservancy
    id: filter_mara_north
    task: filter_df
    partial:
      df: ${{ workflow.fix_comm_geom.return }}
      column_name: name
      op: equal
      value: Mara North Conservancy
      reset_index: true

  - name: Filter grazing zones excluding conservancy
    id: filter_grazing_zones
    task: filter_df
    partial:
      df: ${{ workflow.fix_comm_geom.return }}
      column_name: grazing_zone
      op: ne
      value: Conservancy
      reset_index: true

  - name: Color grazing zones by unique value
    id: color_grazing_zones
    task: apply_color_map
    partial:
      df: ${{ workflow.filter_grazing_zones.return }}
      input_column_name: grazing_zone
      output_column_name: zone_color
      colormap: Greens

  - name: Build grazing zones legend values
    id: grazing_zone_legend_values
    task: ecoscope_workflows_ext_mnc.tasks.transformation.build_legend_values_from_column
    partial:
      df: ${{ workflow.color_grazing_zones.return }}
      label_column: grazing_zone
      color_column: zone_color
      sort: ascending

  - name: Load MNC parcels
    id: load_mnc_parcels
    task: load_df
    partial:
      file_path: ${{ workflow.download_mnc_parcels.return }}
      layer: null
      deserialize_json: false

  - name: Create conservancy boundary layer
    id: create_conservancy_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.filter_conservancy_boundary.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [169, 169, 169, 255]
        get_line_width: 1.75
      legend:
        title: Boundaries
        values:
          - label: Conservancy Boundary
            color: "#a9a9a9"
        sort: null
        label_suffix: null

  - name: Create grazing zones layer
    id: create_grazing_zones_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.color_grazing_zones.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        opacity: 0.5
        get_fill_color: zone_color
        get_line_color: zone_color
        get_line_width: 1.5
      legend:
        title: Grazing Zones
        values: ${{ workflow.grazing_zone_legend_values.return }}

  - name: Create parcels layer
    id: create_parcels_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.load_mnc_parcels.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: [189, 183, 107, 60]
        get_line_color: [189, 183, 107, 255]
        get_line_width: 1.5
      legend:
        title: Boundaries
        values:
          - label: Parcels
            color: "#bdb76b"
        sort: null
        label_suffix: null

  # Retrieve livestock report events
  - name: Retrieve Livestock Events Only 
    id: get_events_data
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - reported_by
        - serial_number
        - geometry
        - created_at
        - event_details
        - patrols
      event_types: [
        "mobile_boma_rep",
        "cattle_count",
        "livestock_predation_rep",
        "illegal_grazing_rep"
        ]
      raise_on_empty: true
      include_details: true
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      include_display_values: false
      force_point_geometry: true 

  # Extract date
  - name: Extract date from events data
    id: extract_event_date
    task: extract_column_as_type
    partial:
      df: ${{ workflow.get_events_data.return }}
      column_name: time
      output_type: date
      output_column_name: date

  - name: Add temporal index on events
    id: events_temporal
    task: add_temporal_index
    partial:
      df: ${{ workflow.extract_event_date.return }}
      time_col: date
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Retrieve mobile boma events only 
    id: filter_mobile_boma 
    task: filter_df 
    partial: 
      df: ${{ workflow.events_temporal.return }}
      column_name: event_type
      op: equal 
      value: mobile_boma_rep 
      reset_index: true 

  - name: Retrieve livestock predation events only 
    id: filter_livestock_predation 
    task: filter_df 
    partial: 
      df: ${{ workflow.events_temporal.return }}
      column_name: event_type
      op: equal 
      value: livestock_predation_rep
      reset_index: true 

  - name: Filter cattle count events only 
    id: filter_cattle_counts 
    task: filter_df 
    partial: 
      df: ${{ workflow.events_temporal.return }}
      column_name: event_type
      op: equal 
      value: cattle_count  
      reset_index: true 
  
  - name: Filter out illegal grazing events only 
    id: filter_illegal_grazing 
    task: filter_df 
    partial: 
      df: ${{ workflow.events_temporal.return }}
      column_name: event_type
      op: equal 
      value: illegal_grazing_rep 
      reset_index: true 
  
  - name: Process mobile boma event details 
    id: process_mobile_boma 
    task: process_events_details 
    partial: 
      df: ${{ workflow.filter_mobile_boma.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize mobile boma events 
    id: normalize_mobile_boma 
    task: normalize_json_column
    partial:
      df: ${{ workflow.process_mobile_boma.return }}
      column: event_details 
      skip_if_not_exists: true 
      sort_columns: true 
  
  - name: Drop mobile boma column prefix 
    id: drop_mobile_prefix 
    task: drop_column_prefix 
    partial: 
      df: ${{ workflow.normalize_mobile_boma.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Process livestock predation event details 
    id: process_livestock_preds 
    task: process_events_details 
    partial: 
      df: ${{ workflow.filter_livestock_predation.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize livestock predation events 
    id: normalize_livestock_preds
    task: normalize_json_column
    partial:
      df: ${{ workflow.process_livestock_preds.return }}
      column: event_details 
      skip_if_not_exists: true 
      sort_columns: true 
  
  - name: Drop livestock predation column prefix 
    id: drop_predation_prefix 
    task: drop_column_prefix 
    partial: 
      df: ${{ workflow.normalize_livestock_preds.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Process cattle count event details 
    id: process_cattle_counts 
    task: process_events_details 
    partial: 
      df: ${{ workflow.filter_cattle_counts.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize cattle count events 
    id: normalize_cattle_count
    task: normalize_json_column
    partial:
      df: ${{ workflow.process_cattle_counts.return }}
      column: event_details 
      skip_if_not_exists: true 
      sort_columns: true 
  
  - name: Drop cattle count column prefix 
    id: drop_cattle_prefix 
    task: drop_column_prefix 
    partial: 
      df: ${{ workflow.normalize_cattle_count.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"
  
  - name: Process illegal grazing event details 
    id: process_illegal_grazing
    task: process_events_details 
    partial: 
      df: ${{ workflow.filter_illegal_grazing.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize illegal grazing events 
    id: normalize_illegal_grazing
    task: normalize_json_column
    partial:
      df: ${{ workflow.process_illegal_grazing.return }}
      column: event_details 
      skip_if_not_exists: true 
      sort_columns: true 
  
  - name: Drop illegal grazing column prefix 
    id: drop_illegal_prefix 
    task: drop_column_prefix 
    partial: 
      df: ${{ workflow.normalize_illegal_grazing.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"
  
  - name: Map mobile boma columns 
    id: map_mobile_boma 
    task: map_columns 
    partial: 
      df: ${{ workflow.drop_mobile_prefix.return }}
      drop_columns: []
      retain_columns: [
        "id",
        "date",
        "event_type",
        "geometry",
        "Date of Relocation",
        "Electric Boma Status",
        "Mobile Boma Zone",
        "Nature of the Site",
        "Reason for relocation",
        ]
      rename_columns: {}
      raise_if_not_found: false 
  
  - name: Summarize mobile boma events 
    id: summarize_mobile_boma 
    task: summarize_df 
    partial: 
      df: ${{ workflow.map_mobile_boma.return }}
      groupby_cols:
        - date 
      summary_params: 
        - display_name: boma_events 
          aggregator: nunique
          column: id 
          decimal_places: 0 
      reset_index: true 
  
  - name: Persist mobile boma summary table
    id: persist_boma_summary
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.summarize_mobile_boma.return }}
      filename: mobile_boma_movement_summary_table 

  # Draw mobile boma map 
  - name: Generate mobile boma point layers
    id: generate_mobile_layers
    task: ecoscope_workflows_ext_custom.tasks.results.create_scatterplot_layer
    partial:
      data_url: null
      layer_style:
        get_fill_color: [0, 0, 128]
        get_line_color: [0, 0, 128]
        get_radius: 3
        opacity: 0.55
        stroked: true
      legend:
        title: Movements
        values: 
          - label: Boma movement
            color: "#000080"
        sort: null
        label_suffix: null
      geodataframe: ${{ workflow.map_mobile_boma.return }} 
  
  - title: Map Zoom & Extent
    type: task-group
    description: Calculate the geographic extent of the movement tracks and determine an appropriate zoom level and center point for the map. This ensures that all tracks are visible and well-framed when the map is rendered.
    tasks:
      - name: null
        id: zoom_to_envelope
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.envelope_gdf
        partial:
          gdf: ${{ workflow.filter_mara_north.return }}

      - name: Zoom view to gdf extent
        id: gdf_image_extent
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
        partial:
          pitch: 0
          bearing: 0
          max_zoom: 15
          gdf: ${{ workflow.zoom_to_envelope.return }}

  - name: Combine styled layers with mobile boma
    id: combine_custom_mobile_boma
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers:
        - ${{ workflow.create_grazing_zones_layer.return }}
        - ${{ workflow.create_parcels_layer.return }}
        - ${{ workflow.create_conservancy_layer.return }}
      grouped_layers: ${{ workflow.generate_mobile_layers.return }}

  - name: Draw mobile boma events map
    id: draw_mobile_boma
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.combine_custom_mobile_boma.return }}
      view_state: ${{ workflow.gdf_image_extent.return }}

  - name: Persist mobile boma map HTML paths
    id: persist_mobile_boma_urls
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_mobile_boma.return }}
      filename: boma_movement_map.html
      filename_suffix: null

  - name: Create mobile boma map widget
    id: mobile_boma_map_widget
    task: create_map_widget_single_view
    partial:
      title: "Mobile Boma Movement Map"
      data: ${{ workflow.persist_mobile_boma_urls.return }}

  - name: Convert mobile boma map to png
    id: convert_mobile_boma_png
    task: html_to_png
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      html_path: ${{ workflow.persist_mobile_boma_urls.return }}
      config:
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 40000
        max_concurrent_pages: 1
    
  - name: Map cattle count columns 
    id: map_cattle_count 
    task: map_columns
    partial:
      df: ${{ workflow.drop_cattle_prefix.return }}
      drop_columns: [
        "total_cattle_counted_from_all_zones"
        ]
      retain_columns: [
        "date",
        "# cattle in Zone 1 mobile boma",
        "# cattle in Zone 2/3 mobile boma",
        "# cattle in Zone 4",

        ]
      rename_columns: {
        "# cattle in Zone 1 mobile boma": "zone_1",
        "# cattle in Zone 2/3 mobile boma": "zone_2_3",
        "# cattle in Zone 4":"zone_4",
        }
      raise_if_not_found: false


  - name: Convert all values to numeric 
    id: convert_cols_numeric
    task: convert_column_values_to_numeric
    partial: 
      df: ${{ workflow.map_cattle_count.return }}
      columns: 
        - "zone_1"
        - "zone_2_3"
        - "zone_4"
  
  - name: Compute total count on all zone columns 
    id: compute_total_count 
    task: ecoscope_workflows_ext_mnc.tasks.aggregation.apply_arithmetic_operation_over_rows
    partial:  
      df: ${{ workflow.convert_cols_numeric.return }}
      columns: 
        - "zone_1"
        - "zone_2_3"
        - "zone_4"
      operation: add
      output_column: total 

  - name: Rename cattle count table columns for display
    id: rename_cattle_count_display
    task: map_columns
    partial:
      df: ${{ workflow.compute_total_count.return }}
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "date": "Date",
        "zone_1": "Zone 1",
        "zone_2_3": "Zone 2/3",
        "zone_4": "Zone 4",
        "total": "Total"
        }
      raise_if_not_found: false

  - name: Persist cattle count table
    id: persist_cattle_count
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.rename_cattle_count_display.return }}
      filename: total_cattle_count_summary_table

  - name: Draw cattle count summary table
    id: cattle_count_table_html
    task: draw_table
    partial:
      dataframe: ${{ workflow.rename_cattle_count_display.return }}
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: true
        enable_download: false
        hide_header: false
      widget_id: "Total Cattle Count Summary"

  - name: Save cattle count summary table (HTML)
    id: cattle_count_table_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.cattle_count_table_html.return }}
      filename: total_cattle_count_summary_table.html
      filename_suffix: null

  - name: Create cattle count summary table widget
    id: cattle_count_table_widget
    task: create_table_widget_single_view
    partial:
      title: "Total Cattle Count Summary"
      data: ${{ workflow.cattle_count_table_html_url.return }}

  - name: Map livestock predation events 
    id: map_livestock_predation 
    task: map_columns
    partial: 
      df: ${{ workflow.drop_predation_prefix.return }}
      drop_columns: [] 
      retain_columns: [
        "id",
        "date",
        "event_type",
        "geometry",
        "Livestock Species",
        "Suspected Predator",
        "Total livestock affected"
        ]
      rename_columns: {}
      raise_if_not_found: false 
  
  - name: Summarize livestock predation events 
    id: summarize_predation_events 
    task: summarize_df 
    partial: 
      df: ${{ workflow.map_livestock_predation.return }}
      groupby_cols:
        - date 
      summary_params: 
        - display_name: livestock_predation_events 
          aggregator: nunique
          column: id 
          decimal_places: 0 
      reset_index: true 

  - name: Rename livestock predation summary table columns for display
    id: rename_predation_summary_display
    task: map_columns
    partial:
      df: ${{ workflow.summarize_predation_events.return }}
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "date": "Date",
        "livestock_predation_events": "Livestock Predation Events"
        }
      raise_if_not_found: false

  - name: Persist livestock predation summary table
    id: persist_predation_summary
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.rename_predation_summary_display.return }}
      filename: total_livestock_predation_summary_table

  - name: Draw livestock predation summary table
    id: predation_summary_table_html
    task: draw_table
    partial:
      dataframe: ${{ workflow.rename_predation_summary_display.return }}
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: true
        enable_download: false
        hide_header: false
      widget_id: "Livestock Predation Summary"

  - name: Save livestock predation summary table (HTML)
    id: predation_summary_table_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.predation_summary_table_html.return }}
      filename: livestock_predation_summary_table.html
      filename_suffix: null

  - name: Create livestock predation summary table widget
    id: predation_summary_table_widget
    task: create_table_widget_single_view
    partial:
      title: "Livestock Predation Summary"
      data: ${{ workflow.predation_summary_table_html_url.return }}

  - name: Format livestock species column 
    id: capitalize_livestock_species 
    task: format_text_column 
    partial: 
      df:  ${{ workflow.map_livestock_predation.return }}
      column: "Livestock Species"
      method: "capitalize"

  - name: Apply colormap to livestock predation events
    id: apply_livestock_colormap
    task: apply_color_map
    partial:
      input_column_name: "Livestock Species"
      output_column_name: colors
      colormap: Set3
      df: ${{ workflow.capitalize_livestock_species.return }}

  - name: Generate livestock predation point layers
    id: generate_livestock_layers
    task: ecoscope_workflows_ext_custom.tasks.results.create_scatterplot_layer
    partial:
      layer_style:
        get_fill_color: colors
        get_line_color: colors
        get_radius: 3
        opacity: 0.55
        stroked: true
      legend:
        title: Livestock Species 
        label_column: "Livestock Species"
        color_column: colors
        sort: ascending
        label_suffix: null
      data_url: null
      geodataframe: ${{ workflow.apply_livestock_colormap.return }}

  - name: Combine styled layers with livestock predation events
    id: combine_custom_livestock
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers:
        - ${{ workflow.create_grazing_zones_layer.return }}
        - ${{ workflow.create_parcels_layer.return }}
        - ${{ workflow.create_conservancy_layer.return }}
      grouped_layers: ${{ workflow.generate_livestock_layers.return }}

  - name: Draw livestock predation map
    id: draw_livestock_map
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.combine_custom_livestock.return }}
      view_state: ${{ workflow.gdf_image_extent.return }}
        # longitude: 35.2092935880001
        # latitude: -1.257840580999955
        # zoom: 9.75
        # pitch: 0 
        # bearing: 0 

  - name: Persist livestock predation map HTML paths
    id: persist_livestock_urls
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_livestock_map.return }}
      filename: livestock_predation_events.html
      filename_suffix: null

  - name: Create livestock predation map widget
    id: livestock_predation_map_widget
    task: create_map_widget_single_view
    partial:
      title: "Livestock Predation Events Map"
      data: ${{ workflow.persist_livestock_urls.return }}

  - name: Convert livestock map to png
    id: convert_livestock_png
    task: html_to_png
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      html_path: ${{ workflow.persist_livestock_urls.return }}
      config:
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 40000
        max_concurrent_pages: 1

  - name: Map livestock predation for summary table 
    id: map_livestock_summary 
    task: map_columns
    partial: 
      df: ${{ workflow.map_livestock_predation.return }}
      drop_columns: [] 
      retain_columns: [
        "date",
        "Livestock Species",
        "Suspected Predator",
        "Total livestock affected"
        ]
      rename_columns: {
        "Livestock Species":"livestock_species",
        "Suspected Predator":"suspected_predator",
        "Total livestock affected":"total_livestock_affected"
        }
      raise_if_not_found: false 

  - name: Replace nulls on livestock predator table with unknown
    id: replace_livestock_nulls
    task: fill_missing_values
    partial:
      df: ${{ workflow.map_livestock_summary.return }}
      subset: 
        - suspected_predator
        - livestock_species
      value: Unknown 
  
  - name: Map others with Unknown 
    id: map_livestock_unknown
    task: replace_column_values
    partial: 
      df: ${{ workflow.replace_livestock_nulls.return }}
      columns: 
        - suspected_predator
      value_map: 
        Other (specify in comments): Unknown
      inplace: true 
      errors: "ignore"

  - name: Convert livestock_affected col to int 
    id: convert_livestock_int
    task: ecoscope_workflows_ext_mnc.tasks.transformation.convert_columns_to_int
    partial: 
      df: ${{ workflow.map_livestock_unknown.return }}
      columns: 
        - total_livestock_affected
      errors: coerce
      fill_value: 0

  - name: Persist livestock summary table 
    id: persist_livestock_summary
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      filename: livestock_predation_summary_table
      df: ${{ workflow.convert_livestock_int.return }}

  - name: Map illegal grazing Events  
    id: map_illegal_grazing 
    task: map_columns
    partial:
      df: ${{ workflow.drop_illegal_prefix.return }}
      drop_columns: []
      retain_columns: [
        "date",
        "event_type",
        "geometry",
        "Herd Zone",
        "Landowner name",
        "action taken",
        ]
      rename_columns: {}
      raise_if_not_found: false 

# Draw illegal grazing map 
  - name: Generate illegal grazing point layers
    id: generate_illegal_layers
    task: ecoscope_workflows_ext_custom.tasks.results.create_scatterplot_layer
    partial:
      layer_style:
        get_fill_color: [0, 0, 128]
        get_line_color: [0, 0, 128]
        get_radius: 3
        opacity: 0.55
        stroked: true
      legend:
        title: Activity
        values: 
          - label: Illegal grazing
            color: "#000080"
        sort: null
        label_suffix: null
      data_url: null
      geodataframe: ${{ workflow.map_illegal_grazing.return }}
  
  - name: Combine styled layers with illegal grazing layer
    id: combine_custom_illegal
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers:
        - ${{ workflow.create_grazing_zones_layer.return }}
        - ${{ workflow.create_parcels_layer.return }}
        - ${{ workflow.create_conservancy_layer.return }}
      grouped_layers: ${{ workflow.generate_illegal_layers.return }}

  - name: Draw illegal grazing events map
    id: draw_illegal_grazing
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.combine_custom_illegal.return }}
      view_state: ${{ workflow.gdf_image_extent.return }}

  - name: Persist illegal grazing map HTML paths
    id: persist_illegal_urls
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_illegal_grazing.return }}
      filename: illegal_grazing_map.html

  - name: Create illegal grazing map widget
    id: illegal_grazing_map_widget
    task: create_map_widget_single_view
    partial:
      title: "Illegal Grazing Events Map"
      data: ${{ workflow.persist_illegal_urls.return }}

  - name: Convert illegal grazing map to png
    id: convert_illegal_png
    task: html_to_png
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      html_path: ${{ workflow.persist_illegal_urls.return }}
      config:
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 40000
        max_concurrent_pages: 1
  
  - name: MNC event report dashboard
    id: mnc_events_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return}}
      widgets:
        - ${{ workflow.mobile_boma_map_widget.return }}
        - ${{ workflow.livestock_predation_map_widget.return }}
        - ${{ workflow.illegal_grazing_map_widget.return }}
        - ${{ workflow.cattle_count_table_widget.return }}
        - ${{ workflow.predation_summary_table_widget.return }}
      time_range: ${{ workflow.time_range.return}}
      groupers: ${{ workflow.groupers.return }}

