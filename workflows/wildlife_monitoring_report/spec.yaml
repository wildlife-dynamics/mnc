id: wildlife_monitoring_report
requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-wwf-virunga
    version: "0.0.0rc9.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-big-life
    version: "1.0.1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mnc
    version: "*"
    channel: "file:///tmp/ecoscope-workflows-custom/release/artifacts/"
    
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

task-instance-defaults:
  skipif:
    conditions: 
      - any_is_empty_df 
      - any_dependency_skipped 

workflow:
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time Range
    id: time_range
    task: set_time_range
      
  - name: Set Groupers
    id: groupers
    task: set_groupers
    partial: 
      groupers: []

  - name: Connect to EarthRanger
    id: er_client_name
    task: set_er_connection

  - name: Configure base map layers
    id: configure_base_maps
    task: set_base_maps_pydeck
    partial:
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 0.80
          max_zoom: 20

        - url: https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places_Alternate/MapServer/tile/{z}/{y}/{x}
          opacity: 0.35
          max_zoom: 20

  - name: Download MNC community conservancy boundaries
    id: persist_mnc_gpkg
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/14rcy4lkwp7xgewj3xf7k/mnc_conservancy.gpkg?rlkey=mtqo7ivxrnvjonm2z1zez6h6f&st=gtdi4vv0&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name: Download MNC Parcels gpkg
    id: download_mnc_parcels
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/33rdzy896rh91gtkfs2j3/mnc_across_the_river_parcels.gpkg?rlkey=xima1v0rozc0h9h78esfogx6q&st=o3gkk5p1&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name : Load community conservancy boundaries
    id: load_comm_shp
    task: load_df
    partial:
      file_path: ${{ workflow.persist_mnc_gpkg.return }}
      layer: null
      deserialize_json: false

  - name: Fix invalid geometries in community boundaries
    id: fix_comm_geom
    task: ecoscope_workflows_ext_mnc.tasks.transformation.fix_invalid_geometries
    partial:
      gdf: ${{ workflow.load_comm_shp.return }}

  - name: Filter conservancy boundary only
    id: filter_conservancy_boundary
    task: filter_df
    partial:
      df: ${{ workflow.fix_comm_geom.return }}
      column_name: grazing_zone
      op: equal
      value: Conservancy
      reset_index: true

  - name: Filter to Mara North Conservancy
    id: filter_mara_north
    task: filter_df
    partial:
      df: ${{ workflow.fix_comm_geom.return }}
      column_name: name
      op: equal
      value: Mara North Conservancy
      reset_index: true

  - name: Load MNC parcels
    id: load_mnc_parcels
    task: load_df
    partial:
      file_path: ${{ workflow.download_mnc_parcels.return }}
      layer: null
      deserialize_json: false

  - name: Create conservancy boundary layer
    id: create_conservancy_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.filter_conservancy_boundary.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [169, 169, 169, 255]
        get_line_width: 1.75
      legend:
        title: ""
        values:
          - label: Conservancy Boundary
            color: "#a9a9a9"
        sort: null
        label_suffix: null

  - name: Create parcels layer
    id: create_parcels_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.load_mnc_parcels.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: [189, 183, 107, 60]
        get_line_color: [189, 183, 107, 255]
        get_line_width: 1.5
      legend:
        title: "Map Layers"
        values:
          - label: Parcels
            color: "#bdb76b"
        sort: null
        label_suffix: null

  # Events 
  - name: Retrieve wildlife events  
    id: get_events_data
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - reported_by
        - serial_number
        - geometry
        - created_at
        - event_details
        - patrols
      event_types: [
        "elephant_sighting_rep",
        "buffalo_sighting_rep",
        "rhino_sighting_rep",
        "lion_sighting_rep",
        "leopardsightingrep",
        "cheetah_sighting_rep",
        "giraffe_sighting",
        "hartebeest_sighting",
        "snare_rep",
        "fire_rep",
        "wildlife_injury_rep",
        "wildlife_treatment_rep",
        "wildlife_carcass_rep",
        ]
      raise_on_empty: true
      include_details: true
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      include_display_values: false
      force_point_geometry: true 

  - name: Persist wildlife events 
    id: persist_wildlife_evs
    task: persist_df 
    partial: 
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      filename: overall_test_wildlife_events
      df: ${{ workflow.get_events_data.return }}
      
  # Extract date
  - name: Extract date from events data
    id: extract_event_date
    task: extract_column_as_type
    partial:
      df: ${{ workflow.get_events_data.return }}
      column_name: time
      output_type: date
      output_column_name: date

  - name: Add temporal index on events
    id: events_temporal
    task: add_temporal_index
    partial:
      df: ${{ workflow.extract_event_date.return }}
      time_col: date
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - title: Map Zoom & Extent
    type: task-group
    description: Calculate the geographic extent of the movement tracks and determine an appropriate zoom level and center point for the map. This ensures that all tracks are visible and well-framed when the map is rendered.
    tasks:
      - name: null
        id: zoom_to_envelope
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.envelope_gdf
        partial:
          gdf: ${{ workflow.filter_mara_north.return }}

      - name: Zoom view to gdf extent
        id: gdf_image_extent
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
        partial:
          pitch: 0
          bearing: 0
          max_zoom: 15
          gdf: ${{ workflow.zoom_to_envelope.return }}
          
  - name: Filter wildlife incident event types
    id: filter_wildlife_events
    task: filter_row_values
    partial:  
      df: ${{ workflow.events_temporal.return }}
      column: event_type
      values: 
        - snare_rep
        - fire_rep 
        - wildlife_injury_rep
        - wildlife_treatment_rep
        - wildlife_carcass_rep

  - name: Process wildlife incident event details 
    id: process_wild_incidents 
    task: process_events_details 
    partial: 
      df: ${{ workflow.filter_wildlife_events.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize wildlife events 
    id: normalize_wildlife_events 
    task: normalize_json_column
    partial:  
      column: event_details 
      df: ${{ workflow.process_wild_incidents.return }}
      skip_if_not_exists: true 
      sort_columns: true

  - name: Drop wildlife incidents column prefix
    id: drop_wild_prefix 
    task: drop_column_prefix 
    partial: 
      df: ${{ workflow.normalize_wildlife_events.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Map wildlife incident event columns 
    id: map_wildlife_inc 
    task: map_columns 
    partial: 
      df: ${{ workflow.drop_wild_prefix.return }}
      drop_columns: [
        "index",
        "time",
        "event_category",
        "reported_by",
        "serial_number",
        ]
      retain_columns: []
      rename_columns: {}
      raise_if_not_found: false 
  
  - name: Persist wildlife incident events as csv 
    id: persist_wildlife_csv
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      filename: wildlife_events_recorded
      df: ${{ workflow.map_wildlife_inc.return }}

  - name: Generate wildlife summary table 
    id: generate_wild_summary 
    task: make_wildlife_summary_table
    partial: 
      df: ${{ workflow.map_wildlife_inc.return }}
      value_map: 
        fire_rep: Fire
        snare_rep: Snare 
        wildlife_carcass_rep: Wildlife carcass 
        wildlife_injury_rep: Injured wildlife
        wildlife_treatment_rep: Veterinary treatment
      max_unique: 6 
      shorten_width: 300 
      order: null 
  
  - name: Persist wildlife summary 
    id: persist_wildlife_df
    task: persist_df 
    partial:  
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: wildlife_incidents_summary_table 
      filetype: csv 
      df: ${{ workflow.generate_wild_summary.return }}

  - name: Calculate wildlife events recorded by date
    id: wildlife_events_recorded
    task: summarize_df
    partial:
      groupby_cols:
        - date
      summary_params:
        - display_name: no_of_events
          aggregator: nunique
          column: id
      reset_index: true
      df: ${{ workflow.map_wildlife_inc.return }}

  - name: Persist wildlife events by date
    id: wildlife_events_df
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.wildlife_events_recorded.return }}
      filename: wildlife_incidents_recorded_by_date

  # Draw Wildlife Predation Events
  - name: Drop null geometry from recorded wildlife incidents
    id: drop_null_inc
    task: ecoscope_workflows_ext_custom.tasks.transformation.drop_null_geometry 
    partial: 
      gdf: ${{ workflow.map_wildlife_inc.return }}
      geometry_column: "geometry"

  - name: Apply Colormap to wildlife predation events
    id: apply_wildlife_colormap
    task: apply_color_map
    partial:
      input_column_name: event_type
      output_column_name: colors
      colormap: tab10
      df: ${{ workflow.drop_null_inc.return }}
  
  - name: Map wildlife values 
    id: map_wildlife_values
    task: map_column_value
    partial: 
      df: ${{ workflow.apply_wildlife_colormap.return }}
      col: event_type
      new_col: event_type_mapped
      mapping: 
        fire_rep: Fire
        snare_rep: Snare 
        wildlife_carcass_rep: Wildlife carcass 
        wildlife_injury_rep: Injured wildlife
        wildlife_treatment_rep: Veterinary treatment
      default: Undefined 
      keep_unmapped: False

  - name: Generate wildlife predation point layers
    id: generate_wildlife_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_scatterplot_layer
    partial:
      data_url: null
      layer_style:
        get_fill_color: colors
        get_line_color: colors
        get_radius: 3
        opacity: 0.55
        stroked: true
      legend:
        title: Wildlife Incidents
        label_column: event_type_mapped
        color_column: colors
        sort: ascending
      geodataframe: ${{ workflow.map_wildlife_values.return }}

  - name: Combine styled layers with wildlife incident events 
    id: combine_custom_wildlife
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers:
        - ${{ workflow.create_parcels_layer.return }}
        - ${{ workflow.create_conservancy_layer.return }}
      grouped_layers: ${{ workflow.generate_wildlife_layer.return }}

  - name: Draw wildlife incident map
    id: draw_wildlife_map
    task: ecoscope_workflows_ext_big_life.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.combine_custom_wildlife.return }}
      view_state: ${{ workflow.gdf_image_extent.return }}

  - name: Persist wildlife predation map HTML paths
    id: persist_wildlife_urls
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_wildlife_map.return }}
      filename: wildlife_incidents_map.html

  - name: Create wildlife incident map widget
    id: wildlife_map_widget
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Wildlife Incident Map"
      data: ${{ workflow.persist_wildlife_urls.return }}

  # Wildlife sighting Events
  # Elephant Events
  - name: Retrieve elephant events
    id: retrieve_elephant_events 
    task: filter_df 
    partial: 
      column_name: event_type
      op: equal 
      value: elephant_sighting_rep
      df: ${{ workflow.events_temporal.return }}
      reset_index: false

  - name: Process elephant event details 
    id: process_elephant_evs 
    task: process_events_details 
    partial: 
      df: ${{ workflow.retrieve_elephant_events.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize elephant events 
    id: normalize_ele_events 
    task: normalize_json_column
    partial:  
      column: event_details 
      df: ${{ workflow.process_elephant_evs.return }}
      skip_if_not_exists: true 
      sort_columns: true

  - name: Drop elephant column prefix
    id: drop_ele_prefix 
    task: drop_column_prefix 
    partial: 
      df: ${{ workflow.normalize_ele_events.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Map elephant event columns
    id: map_elephant_cols
    task: map_columns
    partial:
      drop_columns: [
        "index",
        "time",
        "event_type",
        "event_category",
        "reported_by",
        "serial_number",
        "event_type_display",
        "Comments",
        ]
      retain_columns: []
      rename_columns: {
        "Female":"female",
        "Herd Demographic": "herd_composition",
        "Herd size":"herd_size",
        "Male":"male",
        "Subadult":"sub_adult",
        "< 1 year":"underayear",
        }
      df: ${{ workflow.drop_ele_prefix.return }}
      raise_if_not_found: false 

  - name: Fill missing values with Undefined for elephant events 
    id: fill_undefined_eles 
    task: fill_missing_values 
    partial: 
      df: ${{ workflow.map_elephant_cols.return }}
      value:  "Undefined"
      subset: ["herd_composition"]

  - name: Fill numerical missing values with 0 for elephant events 
    id: fill_num_eles 
    task: fill_missing_values 
    partial: 
      df: ${{ workflow.fill_undefined_eles.return }}
      value:  0
      subset:  ["underayear","female","male","herd_size","sub_adult"]

  - name: Convert elephant numeric values to int 
    id: convert_ele_num
    task: convert_columns_to_int 
    partial: 
      df: ${{ workflow.fill_num_eles.return }}
      errors: coerce 
      fill_value: 0
      columns: ["underayear","female","male","herd_size","sub_adult"]
  
  - name: Map elephant herd-composition values 
    id: map_ele_herd 
    task: map_column_value 
    partial: 
      df: ${{ workflow.convert_ele_num.return }}
      col: "herd_composition"
      mapping: {
        "bachelor":"Bachelor",
        "femalecalf":"Female + Calf",
        "mixed":"Mixed",
        "Undefined":"Unspecified",
        "Unspecified":"Unspecified",
        "Mixed":"Mixed",
        "Female + Calf": "Female + Calf",
        "Bachelor": "Bachelor"
        }
      new_col: "herd_composition_mapped"
      default: "Undefined"
      keep_unmapped: false

  - name: Apply classification to herd size (bins) for elephants
    id: apply_ele_bins
    task: apply_classification
    partial: 
      df: ${{ workflow.map_ele_herd.return }}
      input_column_name: "herd_size"
      output_column_name: "herd_size_bins"
      label_options: 
        label_ranges: true 
        label_decimals: 0 
      classification_options:
        scheme: "equal_interval"
        k: 5

  - name: Order binned herd size for elephants
    id: order_ele_bins 
    task: order_categorical_by_number 
    partial:  
      df: ${{ workflow.apply_ele_bins.return }}
      columns: ["herd_size_bins"]
      errors: ignore

  - name: Draw elephant bins bar chart 
    id: draw_ele_bins
    task: ecoscope_workflows_ext_wwf_virunga.tasks.plot.draw_bar_chart
    partial:
      dataframe: ${{ workflow.order_ele_bins.return }}
      category: herd_size_bins
      mode: grouped
      y_axis: null 
      stack_column: null 
      agg_function: count
      stack_order: null 
      ascending: true 
      color_column: null 
      plot_style: null 
      bar_chart_configs:
        - column: "id"
          agg_func: count
          label: "Number of records"
          show_label: false
          style:
            marker_color: "#6495ed"
            textposition": null
            texttemplate": null
      overlay_opacity: 0.6
      category_order: null 
      layout_style: 
        bargap: 0.05
        bargroupgap: 0.05 
        title: null 
        title_x: 0.01 
        title_y: 0.95 
        showlegend: false
        font_size: 11
        font_color: "#222222"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: "Group size"
          range: null
        yaxis:
          title: "Number of records"
          range: null 
      widget_id: null

  - name: Persist elephant bar chart
    id: persist_elephant_bar
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_ele_bins.return }}
      filename: elephant_herd_size_bar_chart.html

  - name: Create elephant herd size bar chart widget
    id: ele_bar_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Elephant Herd Size Distribution"
      data: ${{ workflow.persist_elephant_bar.return }}

  - name: Drop null geometry from elephant events 
    id: drop_null_eles
    task: ecoscope_workflows_ext_custom.tasks.transformation.drop_null_geometry 
    partial: 
      gdf:  ${{ workflow.order_ele_bins.return }} # summary table 
      geometry_column: "geometry"

  - name: Create elephant events clustered herd size layers
    id: eles_clustered_layer
    task: ecoscope_workflows_ext_big_life.tasks.results.create_clustered_labeled_scatterplot_layer
    partial: 
      data_url: null
      geodataframe: ${{ workflow.drop_null_eles.return }}
      layer_style: 
        get_value: "herd_size"
        aggregate: true
        cluster_padding: 1.0
        cluster_max_radius: 40
        get_fill_color: [0, 191, 255]
        get_line_color: [0, 191, 255]
        get_radius: "herd_size"
        get_line_width: 1
        radius_units:  "pixels"
        radius_scale: 1
        radius_min_pixels: 0
        radius_max_pixels: null
        line_width_units: "pixels"
        line_width_scale: 1
        line_width_min_pixels: 0
        line_width_max_pixels: null
        stroked: true
        filled: true
        text_style:
          get_text_color: [255, 255, 255]
          text_size: 15
          scale_text_to_radius: true
          size_units: "pixels"
          font_family: "monospace"
          font_weight: "normal"
          outline_width: null
          outline_color: null
          get_text_anchor: "middle"
          get_alignment_baseline:  "center"

      legend:
        title: Herd Size
        values:
          - label: Herds
            color: "#00bfff"

  - name: Combine styled layers with elephant herd size events 
    id: combine_ele_herd
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers:
        - ${{ workflow.create_parcels_layer.return }}
        - ${{ workflow.create_conservancy_layer.return }}
      grouped_layers: ${{ workflow.eles_clustered_layer.return }}

  - name: Draw elephant bin map
    id: draw_ele_bin_map
    task: ecoscope_workflows_ext_big_life.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.combine_ele_herd.return }}
      view_state: ${{ workflow.gdf_image_extent.return }}

  - name: Persist elephant herd  map HTML paths
    id: persist_ele_herd_urls
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_ele_bin_map.return }}
      filename: elephant_herd_types_map.html

  - name: Create elephant herd size map widget
    id: ele_herd_size_map_widget
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Elephant Herd Size Map"
      data: ${{ workflow.persist_ele_herd_urls.return }}

  - name: Apply colormap for elephant herd types
    id: ele_herd_types 
    task: apply_color_map 
    partial:
      df: ${{ workflow.drop_null_eles.return }}
      input_column_name: herd_composition
      output_column_name: herd_composition_colors
      colormap: tab10

  - name: Generate elephant herd composition point layers
    id: ele_herd_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_scatterplot_layer
    partial:
      layer_style:
        get_fill_color: herd_composition_colors
        get_line_color: herd_composition_colors
        get_radius: 3
        opacity: 0.55
        stroked: true
      legend:
        title: Herd Types 
        label_column: "herd_composition"
        color_column: herd_composition_colors
        sort: ascending
        label_suffix: null
      data_url: null
      geodataframe: ${{ workflow.ele_herd_types.return }}

  - name: Combine styled layers with elephant herd size events 
    id: combine_ele_types
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers:
        - ${{ workflow.create_parcels_layer.return }}
        - ${{ workflow.create_conservancy_layer.return }}
      grouped_layers: ${{ workflow.ele_herd_layer.return }}

  - name: Draw elephant bin map
    id: draw_ele_herd_map
    task: ecoscope_workflows_ext_big_life.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.combine_ele_types.return }}
      view_state: ${{ workflow.gdf_image_extent.return }}

  - name: Persist elephant events  map HTML paths
    id: persist_elephant_urls
    task: persist_text
    partial:
