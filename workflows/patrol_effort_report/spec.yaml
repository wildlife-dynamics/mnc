id: patrol_effort_report
requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-wwf-virunga
    version: "0.0.0rc9.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-big-life
    version: "1.0.1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mnc
    version: "*"
    channel: "file:///tmp/ecoscope-workflows-custom/release/artifacts/"
    
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

task-instance-defaults:
  skipif:
    conditions: 
      - any_is_empty_df 
      - any_dependency_skipped 

workflow:
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time Range
    id: time_range
    task: set_time_range
      
  - name: Set Groupers
    id: groupers
    task: set_groupers
    partial: 
      groupers: []

  - name: Connect to EarthRanger
    id: er_client_name
    task: set_er_connection

  - name: Configure base map layers
    id: configure_base_maps
    task: set_base_maps_pydeck
    partial:
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 0.80
          max_zoom: 20

        - url: https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places_Alternate/MapServer/tile/{z}/{y}/{x}
          opacity: 0.35
          max_zoom: 20

  - name: Download MNC community conservancy boundaries
    id: persist_mnc_gpkg
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/14rcy4lkwp7xgewj3xf7k/mnc_conservancy.gpkg?rlkey=mtqo7ivxrnvjonm2z1zez6h6f&st=gtdi4vv0&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name: Download MNC Parcels gpkg
    id: download_mnc_parcels
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/33rdzy896rh91gtkfs2j3/mnc_across_the_river_parcels.gpkg?rlkey=xima1v0rozc0h9h78esfogx6q&st=o3gkk5p1&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name : Load community conservancy boundaries
    id: load_comm_shp
    task: load_df
    partial:
      file_path: ${{ workflow.persist_mnc_gpkg.return }}
      layer: null
      deserialize_json: false

  - name: Fix invalid geometries in community boundaries
    id: fix_comm_geom
    task: ecoscope_workflows_ext_mnc.tasks.transformation.fix_invalid_geometries
    partial:
      gdf: ${{ workflow.load_comm_shp.return }}

  - name: Filter conservancy boundary only
    id: filter_conservancy_boundary
    task: filter_df
    partial:
      df: ${{ workflow.fix_comm_geom.return }}
      column_name: grazing_zone
      op: equal
      value: Conservancy
      reset_index: true

  - name: Filter to Mara North Conservancy
    id: filter_mara_north
    task: filter_df
    partial:
      df: ${{ workflow.fix_comm_geom.return }}
      column_name: name
      op: equal
      value: Mara North Conservancy
      reset_index: true

  - name: Load MNC parcels
    id: load_mnc_parcels
    task: load_df
    partial:
      file_path: ${{ workflow.download_mnc_parcels.return }}
      layer: null
      deserialize_json: false

  - name: Create conservancy boundary layer
    id: create_conservancy_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.filter_conservancy_boundary.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [169, 169, 169, 255]
        get_line_width: 1.75
      legend:
        title: ""
        values:
          - label: Conservancy Boundary
            color: "#a9a9a9"
        sort: null
        label_suffix: null

  - name: Create parcels layer
    id: create_parcels_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.load_mnc_parcels.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: [189, 183, 107, 60]
        get_line_color: [189, 183, 107, 255]
        get_line_width: 1.5
      legend:
        title: "Map Layers"
        values:
          - label: Parcels
            color: "#bdb76b"
        sort: null
        label_suffix: null

  # Total events recorded and patrol efforts
  - name: Retrieve all events 
    id: get_events_data
    task: get_events

    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - reported_by
        - serial_number
        - geometry
        - created_at
        - event_details
        - patrols
      event_types: []
      raise_on_empty: true
      include_details: true
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      include_display_values: false
      force_point_geometry: true 

  # Extract date
  - name: Extract date from events data
    id: extract_event_date
    task: extract_column_as_type
    partial:
      df: ${{ workflow.get_events_data.return }}
      column_name: time
      output_type: date
      output_column_name: date

  - name: Add temporal index on events
    id: events_temporal
    task: add_temporal_index
    partial:
      df: ${{ workflow.extract_event_date.return }}
      time_col: date
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Exclude specific events types from total events
    id: filter_events
    task: exclude_row_values
    partial:  
      df: ${{ workflow.events_temporal.return }}
      column: event_type 
      values:
        - distancecountwildlife_rep
        - distancecountpatrol_rep
        - airstrip_operations

  - name: Calculate total events
    id: total_events_recorded
    task: summarize_df
    partial:
      groupby_cols:
        - date
      summary_params:
        - display_name: no_of_events
          aggregator: nunique
          column: id
      reset_index: true
      df: ${{ workflow.filter_events.return }}
  
  - name: Persist total events df 
    id: persist_tevents_df
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.total_events_recorded.return }}
      filename: total_events_recorded_by_date

  - name: Calculate total events recorded by event type
    id: total_events_type_recorded
    task: summarize_df
    partial:
      groupby_cols:
        - date
        - event_type
      summary_params:
        - display_name: no_of_events
          aggregator: nunique
          column: id
      reset_index: true
      df: ${{ workflow.filter_events.return }}

  - name: Persist total events by event type df
    id: persist_summary_event_type
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.total_events_type_recorded.return }}
      filename: total_events_recorded_by_type

  - name: Draw total events line chart 
    id: draw_events_chart 
    task: ecoscope.platform.tasks.results.draw_line_chart
    partial:
      smoothing: null
      dataframe: ${{ workflow.total_events_recorded.return }}
      x_column: date 
      y_column: no_of_events
      category_column: null
      line_kwargs:
        shape: "linear"
        color: "lightsteelblue"
      layout_kwargs:
        title: null
        title_x: 0.01
        title_y:  0.95
        showlegend: false
        fontsize: 10
        fontcolor: "#222222"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: "Date"
          tickformat: "%Y-%m-%d"
          tickangle: -45
          rangemode: auto
        yaxis:
          title: "Number of events"
          tickformat: ".1f"
        hovermode: "x unified"

  - name: Persist Total events chart as text
    id: persist_total_events
    task: persist_text
    partial:
      root_path:  ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_events_chart.return }}
      filename: total_events_recorded.html # -- convert this to .png

  # Patrol Information 
  - title: Map Zoom & Extent
    type: task-group
    description: Calculate the geographic extent of the movement tracks and determine an appropriate zoom level and center point for the map. This ensures that all tracks are visible and well-framed when the map is rendered.
    tasks:
      - name: null
        id: zoom_to_envelope
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.envelope_gdf
        partial:
          gdf: ${{ workflow.filter_mara_north.return }}

      - name: Zoom view to gdf extent
        id: gdf_image_extent
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
        partial:
          pitch: 0
          bearing: 0
          max_zoom: 15
          gdf: ${{ workflow.zoom_to_envelope.return }}

  - name : Filter events and get patrol information 
    id: filter_patrol_info_events
    task: filter_df
    partial:
      column_name: event_type
      op: equal
      value: patrol_info
      df: ${{ workflow.events_temporal.return }}
      reset_index: false

  - name: Process patrol event details 
    id: process_patrol_events
    task: process_events_details 
    partial: 
      df: ${{ workflow.filter_patrol_info_events.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize patrol events
    id: normalize_patrols
    task: normalize_json_column
    partial:
      column: event_details
      df: ${{ workflow.process_patrol_events.return }}
      skip_if_not_exists: true 
      sort_columns: true 

  - name: Drop patrol column prefix
    id: drop_patrol_prefix 
    task: drop_column_prefix 
    partial: 
      df: ${{ workflow.normalize_patrols.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Rename patrol information columns 
    id: rename_patrol_info
    task: map_columns
    partial:
      raise_if_not_found: true
      drop_columns: [
        "index",
        "time",
        "event_type",
        "event_category",
        "reported_by",
        "serial_number",
        "event_type_display",
        "Person Who Authorised?",
      ]
      retain_columns: []
      rename_columns: {
        "patrols":"patrol_id",
        "Participants":"participants",
        "Patrol Purpose":"patrol_purpose",
        "Transport Type":"transport_type"
      }

      df: ${{ workflow.drop_patrol_prefix.return }}

  - name: Patrol information Summary
    id: patrol_info_summary
    task: summarize_df
    partial:
      groupby_cols:
        - patrol_purpose
      summary_params:
        - display_name: number_of_patrols
          aggregator: nunique 
          column: id 
          original_unit: null 
          new_unit: null 
          decimal_places: 0
      reset_index: true
      df: ${{ workflow.rename_patrol_info.return }}

  - name: Persist patrol summary table 
    id: persist_patrol_df
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      filename: patrol_purpose_summary
      df: ${{ workflow.patrol_info_summary.return }}

  # patrol observations 
  - name: Filter null values from patrol id 
    id: filter_null_patrols
    task: filter_notna 
    partial: 
      df: ${{ workflow.rename_patrol_info.return }}
      column_names: ["patrol_id"]

  - name: Fill missing values in transport_type column 
    id: fill_transport_type 
    task: fill_missing_values 
    partial: 
      df: ${{ workflow.filter_null_patrols.return }}
      value: "Undefined"
      subset: ["transport_type"]

  - name: Explode patrol id values  
    id: explode_patrol_id 
    task: explode 
    partial: 
      df: ${{ workflow.fill_transport_type.return }}
      column_name: "patrol_id"
      ignore_index: true 

  - name: Get patrol values from events 
    id: get_patrol_event_values 
    task: get_patrol_values 
    partial: 
      events_df: ${{ workflow.explode_patrol_id.return }}
      patrols_column: patrol_id
      client: ${{ workflow.er_client_name.return }}
      max_workers: 10
  
  - name: Get patrol observations 
    id: get_patrol_obs 
    task: get_patrol_observations_from_patrols_df 
    partial: 
      client: ${{ workflow.er_client_name.return }}
      patrols_df: ${{ workflow.get_patrol_event_values.return }}
      include_patrol_details: true 
      raise_on_empty: true 
      sub_page_size: 100 

  - name: Join patrols df 
    id: join_patrol_df 
    task: map_columns
    partial: 
      df: ${{ workflow.explode_patrol_id.return }}
      drop_columns: []
      retain_columns: [
        "id",
        "patrol_id",
        "participants",
        "patrol_purpose",
        "transport_type"
        ]
      rename_columns: {}
      raise_if_not_found: false

  - name: Merge patrol events and patrol observations
    id: merge_patrol_df_obs 
    task: merge_two_dataframes 
    partial: 
      left: ${{ workflow.get_patrol_obs.return }}
      right: ${{ workflow.join_patrol_df.return }}
      on: "patrol_id"
      left_on: null
      right_on: null
      left_index: false
      right_index: false
      fillna_value:  null
      how: inner

  - name: Explode participants columns on observation   
    id: explode_participants 
    task: explode 
    partial: 
      df: ${{ workflow.merge_patrol_df_obs.return }}
      ignore_index: true 
      column_name: "participants"

  - name: Transform observations to relocations
    id: obs_relocs
    task: process_relocations
    partial:
      observations: ${{ workflow.explode_participants.return }}
      relocs_columns: [
        "extra__id",
        "extra__created_at",
        "extra__subject_id",
        "geometry",
        "groupby_col",
        "fixtime",
        "junk_status",
        "patrol_id",
        "patrol_title",
        "patrol_serial_number",
        "patrol_start_time",
        "patrol_end_time",
        "patrol_type",
        "patrol_status",
        "patrol_subject",
        "patrol_type__value",
        "participants",
        "patrol_purpose",
        "transport_type"
        ]
      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - name: Persist patrol relocations as geoparquet
    id: persist_relocs
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: geoparquet 
      filename: patrol_relocations
      df: ${{ workflow.obs_relocs.return }}


  - name: Filter foot patrol observations 
    id: filter_foot_patrols
    task: filter_df
    partial:
      column_name: transport_type
      op: equal
      value: Foot
      df:  ${{ workflow.obs_relocs.return }}
      reset_index: true

  - name: Filter vehicle patrol observations 
    id: filter_vehicle_patrols
    task: filter_df
    partial:
      column_name: transport_type
      op: equal
      value: Vehicle
      df:  ${{ workflow.obs_relocs.return }}
      reset_index: false

  - name: Filter motorbike patrol observations 
    id: filter_motor_patrols
    task: filter_df
    partial:
      column_name: transport_type
      op: equal
      value: Motorbike
      df:  ${{ workflow.obs_relocs.return }}
      reset_index: false


  - name: Convert vehicle relocations to trajectories
    id: vehicle_trajs
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.filter_vehicle_patrols.return }}
      trajectory_segment_filter:
        min_length_meters: 0.35
        max_length_meters: 5000.0
        max_time_secs: 18000.0
        min_time_secs: 1.0
        max_speed_kmhr: 100.0
        min_speed_kmhr: 10.0
      
  - name: Convert motorbike relocations to trajectories
    id: motor_trajs
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.filter_motor_patrols.return }}
      trajectory_segment_filter:
        min_length_meters: 0.35
        max_length_meters: 5000.0
        max_time_secs: 18000.0
        min_time_secs: 1.0
        max_speed_kmhr: 100.0
        min_speed_kmhr: 10.0

  - name: Convert foot relocations to trajectories
    id: foot_trajs
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.filter_foot_patrols.return }}
      trajectory_segment_filter:
        min_length_meters: 0.001
        max_length_meters: 5000.0
        max_time_secs: 14400.0
        min_time_secs: 1.0
        max_speed_kmhr: 9.0
        min_speed_kmhr: 0.5

  - name: Add temporal index to foot trajs
    id: temporal_foot_traj
    task: add_temporal_index
    partial:
      df: ${{ workflow.foot_trajs.return }}
      time_col: segment_start
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Add temporal index to vehicle trajs
    id: temporal_vehicle_traj
    task: add_temporal_index
    partial:
      df: ${{ workflow.vehicle_trajs.return }}
      time_col: segment_start
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Add temporal index to motorbike trajs
    id: temporal_motor_traj
    task: add_temporal_index
    partial:
      df: ${{ workflow.motor_trajs.return }}
      time_col: segment_start
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Rename foot traj columns
    id: rename_foot_trajs
    task: map_columns
    partial:
      raise_if_not_found: true
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "extra__created_at":"created_at",
        "extra__id":"id",
        "extra__index":"index",
        "extra__participants":"participants",
        "extra__patrol_end_time":"patrol_end_time",
        "extra__patrol_id":"patrol_id",
        "extra__patrol_purpose":"patrol_purpose",
        "extra__patrol_serial_number":"patrol_serial_number",
        "extra__patrol_start_time":"patrol_start_time",
        "extra__patrol_status":"patrol_status",
        "extra__patrol_subject":"patrol_subject",
        "extra__patrol_title":"patrol_title",
        "extra__patrol_type":"patrol_type",
        "extra__patrol_type__value":"patrol_type_value",
        "extra__subject_id":"subject_id",
        "extra__transport_type":"transport_type"
        }
      df: ${{ workflow.temporal_foot_traj.return }}

  - name: Rename vehicle traj columns
    id: rename_vehicle_trajs
    task: map_columns
    partial:
      raise_if_not_found: true
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "extra__created_at":"created_at",
        "extra__id":"id",
        "extra__index":"index",
        "extra__participants":"participants",
        "extra__patrol_end_time":"patrol_end_time",
        "extra__patrol_id":"patrol_id",
        "extra__patrol_purpose":"patrol_purpose",
        "extra__patrol_serial_number":"patrol_serial_number",
        "extra__patrol_start_time":"patrol_start_time",
        "extra__patrol_status":"patrol_status",
        "extra__patrol_subject":"patrol_subject",
        "extra__patrol_title":"patrol_title",
        "extra__patrol_type":"patrol_type",
        "extra__patrol_type__value":"patrol_type_value",
        "extra__subject_id":"subject_id",
        "extra__transport_type":"transport_type"
        }
      df: ${{ workflow.temporal_vehicle_traj.return }}

  - name: Rename motor traj columns
    id: rename_motor_trajs
    task: map_columns
    partial:
      raise_if_not_found: true
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "extra__created_at":"created_at",
        "extra__id":"id",
        "extra__index":"index",
        "extra__participants":"participants",
        "extra__patrol_end_time":"patrol_end_time",
        "extra__patrol_id":"patrol_id",
        "extra__patrol_purpose":"patrol_purpose",
        "extra__patrol_serial_number":"patrol_serial_number",
        "extra__patrol_start_time":"patrol_start_time",
        "extra__patrol_status":"patrol_status",
        "extra__patrol_subject":"patrol_subject",
        "extra__patrol_title":"patrol_title",
        "extra__patrol_type":"patrol_type",
        "extra__patrol_type__value":"patrol_type_value",
        "extra__subject_id":"subject_id",
        "extra__transport_type":"transport_type"
        }
      df: ${{ workflow.temporal_motor_traj.return }}

  - name: Summarize foot patrol metrics
    id: foot_patrol_metrics
    task: summarize_df
    partial:
      groupby_cols:
        - patrol_type_value
      summary_params:
        - display_name: no_of_patrols
          aggregator: nunique
          column: patrol_id

        - display_name: distance_km
          aggregator: sum
          column: dist_meters
          original_unit: m
          new_unit: km

        - display_name: duration_hrs
          aggregator: sum
          column: timespan_seconds
          original_unit: s
          new_unit: h

        - display_name: average_speed 
          aggregator: mean 
          column: speed_kmhr
      reset_index: true
      df: ${{ workflow.rename_foot_trajs.return }}

  - name: Persist foot patrol metrics
    id: persist_foot_df
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      filename: foot_patrol_efforts
      df: ${{ workflow.foot_patrol_metrics.return }}

  - name: Summarize vehicle patrol metrics
    id: vehicle_patrol_metrics
    task: summarize_df
    partial:
      groupby_cols:
        - patrol_type_value
      summary_params:
        - display_name: no_of_patrols
          aggregator: nunique
          column: patrol_id
        - display_name: distance_km
          aggregator: sum
          column: dist_meters
          original_unit: m
          new_unit: km
        - display_name: duration_hrs
          aggregator: sum
          column: timespan_seconds
          original_unit: s
          new_unit: h
        - display_name: average_speed 
          aggregator: mean 
          column: speed_kmhr
      reset_index: true
      df: ${{ workflow.rename_vehicle_trajs.return }}

  - name: Persist vehicle patrol metrics
    id: persist_vehicle_df
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.vehicle_patrol_metrics.return }}
      filename: vehicle_patrol_efforts

 # Motorbike patrol metrics and persist
  - name: Summarize motorbike patrol metrics
    id: motor_patrol_metrics
    task: summarize_df
    partial:
      groupby_cols:
        - patrol_type_value
      summary_params:
        - display_name: no_of_patrols
          aggregator: nunique
          column: patrol_id
        - display_name: distance_km
          aggregator: sum
          column: dist_meters
          original_unit: m
          new_unit: km
        - display_name: duration_hrs
          aggregator: sum
