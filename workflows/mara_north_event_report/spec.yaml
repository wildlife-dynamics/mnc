    id: map_leopards
    task: map_column_value 
    partial: 
      df: ${{ workflow.fill_undefined_leo.return }}
      col: "individuals_present"
      mapping: {
        "Undefined":"Undefined",
        "Other (specify in comments)":"Undefined",
        "Unknown":"Undefined",
