id: mara_north_event_report
requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-wwf-virunga
    version: "0.0.0rc9.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-big-life
    version: "1.0.1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mnc
    version: "*"
    channel: "file:///tmp/ecoscope-workflows-custom/release/artifacts/"
    
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

task-instance-defaults:
  skipif:
    conditions: 
      - any_is_empty_df 
      - any_dependency_skipped 
      
workflow:
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time Range
    id: time_range
    task: set_time_range
      
  - name: Set Groupers
    id: groupers
    task: set_groupers
    partial: 
      groupers: []

  - name: Connect to EarthRanger
    id: er_client_name
    task: set_er_connection

  - name: Configure base map layers
    id: configure_base_maps
    task: set_base_maps_pydeck
    partial:
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 0.80
          max_zoom: 20

        - url: https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places_Alternate/MapServer/tile/{z}/{y}/{x}
          opacity: 0.35
          max_zoom: 20

  - name: Download MNC community conservancy boundaries
    id: persist_mnc_gpkg
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/14rcy4lkwp7xgewj3xf7k/mnc_conservancy.gpkg?rlkey=mtqo7ivxrnvjonm2z1zez6h6f&st=gtdi4vv0&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name: Download MNC Parcels gpkg
    id: download_mnc_parcels
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/33rdzy896rh91gtkfs2j3/mnc_across_the_river_parcels.gpkg?rlkey=xima1v0rozc0h9h78esfogx6q&st=o3gkk5p1&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name : Load community conservancy boundaries
    id: load_comm_shp
    task: load_df
    partial:
      file_path: ${{ workflow.persist_mnc_gpkg.return }}
      layer: null
      deserialize_json: false

  - name: Fix invalid geometries in community boundaries
    id: fix_comm_geom
    task: ecoscope_workflows_ext_mnc.tasks.transformation.fix_invalid_geometries
    partial:
      gdf: ${{ workflow.load_comm_shp.return }}

  - name: Filter conservancy boundary only
    id: filter_conservancy_boundary
    task: filter_df
    partial:
      df: ${{ workflow.fix_comm_geom.return }}
      column_name: grazing_zone
      op: equal
      value: Conservancy
      reset_index: true

  - name: Filter to Mara North Conservancy
    id: filter_mara_north
    task: filter_df
    partial:
      df: ${{ workflow.fix_comm_geom.return }}
      column_name: name
      op: equal
      value: Mara North Conservancy
      reset_index: true

  - name: Filter grazing zones excluding conservancy
    id: filter_grazing_zones
    task: filter_df
    partial:
      df: ${{ workflow.fix_comm_geom.return }}
      column_name: grazing_zone
      op: ne
      value: Conservancy
      reset_index: true

  - name: Color grazing zones by unique value
    id: color_grazing_zones
    task: apply_color_map
    partial:
      df: ${{ workflow.filter_grazing_zones.return }}
      input_column_name: grazing_zone
      output_column_name: zone_color
      colormap: GnBu #Greens

  - name: Build grazing zones legend values
    id: grazing_zone_legend_values
    task: ecoscope_workflows_ext_mnc.tasks.transformation.build_legend_values_from_column
    partial:
      df: ${{ workflow.color_grazing_zones.return }}
      label_column: grazing_zone
      color_column: zone_color
      sort: ascending

  - name: Load MNC parcels
    id: load_mnc_parcels
    task: load_df
    partial:
      file_path: ${{ workflow.download_mnc_parcels.return }}
      layer: null
      deserialize_json: false

  - name: Create conservancy boundary layer
    id: create_conservancy_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.filter_conservancy_boundary.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [169, 169, 169, 255]
        get_line_width: 1.75
      legend:
        title: ""
        values:
          - label: Conservancy Boundary
            color: "#a9a9a9"
        sort: null
        label_suffix: null

  - name: Create grazing zones layer
    id: create_grazing_zones_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.color_grazing_zones.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        opacity: 0.5
        get_fill_color: zone_color
        get_line_color: zone_color
        get_line_width: 1.5
      legend:
        title: Map Layers
        values: ${{ workflow.grazing_zone_legend_values.return }}

  - name: Create parcels layer
    id: create_parcels_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.load_mnc_parcels.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: [189, 183, 107, 60]
        get_line_color: [189, 183, 107, 255]
        get_line_width: 1.5
      legend:
        title: ""
        values:
          - label: Parcels
            color: "#bdb76b"
        sort: null
        label_suffix: null

  #1. Weather Report 
    # 1. --- Weather report --- 
  - name: Retrieve weather observations from GMMF 
    id: subject_observations
    task: get_subjectgroup_observations
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      filter: clean
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      raise_on_empty: false
      include_details: false
      include_subjectsource_details: false
      subject_group_name: "ER2ER - From GMMF"
  
  # Extract precipitation data
  - name: Extract precipitation data
    id: extract_precipitation
    task: extract_value_from_json_column
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.subject_observations.return }}
      column_name: extra__observation_details
      field_name_options:
        - precipitation
      output_type: float
      output_column_name: precipitation
  
  # Extract temperature data
  - name: Extract temperature data
    id: extract_temperature
    task: extract_value_from_json_column
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.extract_precipitation.return }}
      column_name: extra__observation_details
      field_name_options:
        - surface_air_temperature
      output_type: float
      output_column_name: temperature
  
  # Extract wind speed data 
  - name: Extract wind speed data
    id: extract_wind_speed
    task: extract_value_from_json_column
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.extract_temperature.return }}
      column_name: extra__observation_details
      field_name_options:
        - wind_speed
      output_type: float
      output_column_name: wind_speed

  # Extract wind gusts data 
  - name: Extract wind gusts data
    id: extract_wind_gusts
    task: extract_value_from_json_column
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.extract_wind_speed.return }}
      column_name: extra__observation_details
      field_name_options:
        - wind_gusts
      output_type: float
      output_column_name: wind_gusts

    # Extract soil temperature data 
  - name: Extract soil temperature data
    id: extract_soil_temperature
    task: extract_value_from_json_column
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.extract_wind_gusts.return }}
      column_name: extra__observation_details
      field_name_options:
        - soil_temperature
      output_type: float
      output_column_name: soil_temperature

    # Extract relative humidity data 
  - name: Extract relative humidity data
    id: extract_relative_humidity
    task: extract_value_from_json_column
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.extract_soil_temperature.return }}
      column_name: extra__observation_details
      field_name_options:
        - relative_humidity
      output_type: float
      output_column_name: relative_humidity

    # Extract atmospheric pressure data
  - name: Extract atmospheric pressure data
    id: extract_pressure
    task: extract_value_from_json_column
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.extract_relative_humidity.return }}
      column_name: extra__observation_details
      field_name_options:
        - atmospheric_pressure
      output_type: float
      output_column_name: atmospheric_pressure

  # Extract date
  - name: Extract date
    id: extract_date
    task: extract_column_as_type
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.extract_pressure.return }}
      column_name: fixtime
      output_type: date
      output_column_name: date
  
  # Rename column
  - name: Rename value grouper columns
    id: rename_grouper_columns
    task: map_columns
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      raise_if_not_found: true
      df: ${{ workflow.extract_date.return }}
      drop_columns: []
      retain_columns: []
      rename_columns:
        extra__subject__name: "weather_station"

  - name: Add temporal index
    id: df_with_temporal_index
    task: add_temporal_index
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.rename_grouper_columns.return }}
      time_col: fixtime
      cast_to_datetime: true
      groupers: ${{ workflow.groupers.return }}
      format: mixed 

  - name: Calculate weather summary table 
    id: daily_weather
    task: summarize_df
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.df_with_temporal_index.return }}
      groupby_cols:
        - weather_station
        - date
      summary_params:
        - display_name: precipitation
          aggregator: sum
          column: precipitation

        - display_name: temperature
          aggregator: mean
          column: temperature

        - display_name: wind_speed
          aggregator: mean
          column: wind_speed
        
        - display_name: wind_gusts
          aggregator: max
          column: wind_gusts
        
        - display_name: soil_temperature
          aggregator: mean 
          column: soil_temperature

        - display_name: relative_humidity
          aggregator: mean 
          column: relative_humidity

        - display_name: atmospheric_pressure
          aggregator: mean 
          column: atmospheric_pressure

      reset_index: true

  - name: Perist weather summary table 
    id: persist_weather_summary 
    task: persist_df
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:  
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.daily_weather.return }}
      filename: weather_summary_table

  # Draw weather charts and persist
  # Draw precipitation chart and persist
  - name: Draw precipitation chart
    id: precipitation_chart
    task: ecoscope.platform.tasks.results.draw_line_chart
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      smoothing: null
      dataframe: ${{ workflow.daily_weather.return }}
      x_column: date
      y_column: precipitation
      category_column: weather_station
      line_kwargs:
        shape: "linear"
      layout_kwargs:
        title: null
        title_x: 0.01
        title_y:  0.95
        showlegend: true
        fontsize: 10
        fontcolor: "#222222"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: "Date"
          showgrid: true
          gridcolor: "#e0e0e0"
          gridwidth: 1
          tickformat: "%Y-%m-%d"
          tickangle: -45
          rangemode: auto
        yaxis:
          title: "Precipitation (mm)"
          tickformat: ".1f"
        legend_title: "Weather Station"
        hovermode: "x unified"

  - name: Persist precipitation chart as text
    id: persist_precipitation
    task: persist_text
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      root_path:  ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.precipitation_chart.return }}
      filename: precipitation_readings_over_time.html

  - name: Create precipitation plot widget
    id: precipitation_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Precipitation"
      data: ${{ workflow.persist_precipitation.return }}

  # Draw temperature chart ,persist
  - name: Draw temperature chart
    id: temperature_chart
    task: ecoscope.platform.tasks.results.draw_line_chart
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
