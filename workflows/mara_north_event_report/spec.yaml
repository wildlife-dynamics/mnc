      filename: temperature_readings_over_time.html

  - name: Create temperature plot widget
    id: temperature_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Temperature"
      data: ${{ workflow.persist_temperature.return }}

  # Draw wind speed  chart, persist and add widgets
  - name: Draw wind speed chart 
    id: wind_speed_chart
    task: ecoscope.platform.tasks.results.draw_line_chart
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
