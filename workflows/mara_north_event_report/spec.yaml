    id: drop_leo_prefix 
    task: drop_column_prefix 
    partial: 
      df: ${{ workflow.normalize_leo_events.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Map leopard event columns
    id: map_leopard_cols
    task: map_columns
    partial:
      drop_columns: [
        "index",
        "time",
        "event_type",
        "event_category",
        "reported_by",
        "serial_number",
        "event_type_display",
        "Comment",
        "Behavior",
        ]
      retain_columns: []
      rename_columns: {
        "Female":"female",
        "Male":"male",
        "Group Size":"group_size",
        "Individuals Present":"individuals_present",
        "Young":"young",
        }
      df: ${{ workflow.drop_leo_prefix.return }}
      raise_if_not_found: false 

