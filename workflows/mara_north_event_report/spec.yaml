  # 5. Patrol Report 
  - name: Exclude specific events types from total events
    id: filter_events
    task: exclude_row_values
    partial:  
      df: ${{ workflow.events_temporal.return }}
      column: event_type 
      values:
        - distancecountwildlife_rep
        - distancecountpatrol_rep
        - airstrip_operations

  - name: Calculate total events
    id: total_events_recorded
    task: summarize_df
    partial:
      groupby_cols:
        - date
      summary_params:
        - display_name: no_of_events
          aggregator: nunique
          column: id
      reset_index: true
      df: ${{ workflow.filter_events.return }}
  
  - name: Persist total events df 
    id: persist_tevents_df
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.total_events_recorded.return }}
      filename: total_events_recorded_by_date

  - name: Calculate total events recorded by event type
    id: total_events_type_recorded
    task: summarize_df
    partial:
      groupby_cols:
        - date
        - event_type
      summary_params:
        - display_name: no_of_events
          aggregator: nunique
          column: id
      reset_index: true
      df: ${{ workflow.filter_events.return }}

  - name: Persist total events by event type df
    id: persist_summary_event_type
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.total_events_type_recorded.return }}
      filename: total_events_recorded_by_type

  - name: Draw total events line chart 
    id: draw_events_chart 
    task: ecoscope.platform.tasks.results.draw_line_chart
    partial:
      smoothing: null
      dataframe: ${{ workflow.total_events_recorded.return }}
      x_column: date 
      y_column: no_of_events
      category_column: null
      line_kwargs:
        shape: "linear"
        color: "lightsteelblue"
      layout_kwargs:
        title: null
        title_x: 0.01
        title_y:  0.95
        showlegend: false
        fontsize: 10
        fontcolor: "#222222"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: "Date"
          tickformat: "%Y-%m-%d"
          tickangle: -45
          rangemode: auto
        yaxis:
          title: "Number of events"
          tickformat: ".1f"
        hovermode: "x unified"

  - name: Persist Total events chart as text
    id: persist_total_events
    task: persist_text
    partial:
      root_path:  ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_events_chart.return }}
      filename: total_events_recorded.html # -- convert this to .png

  - name: Convert total events chart to png
    id: convert_events_chart_png
    task: html_to_png
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      html_path: ${{ workflow.persist_total_events.return }}
      config:
        width: 1280
        height: 720
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 10
        timeout: 0
        max_concurrent_pages: 5

  - name: Create total events chart widget
    id: events_chart_widget
    task: create_plot_widget_single_view
    partial:
      title: "Total Events Recorded"
      data: ${{ workflow.persist_total_events.return }}

  # Patrol Information
  - name : Filter events and get patrol information 
    id: filter_patrol_info_events
    task: filter_df
    partial:
      column_name: event_type
      op: equal
      value: patrol_info
      df: ${{ workflow.events_temporal.return }}
      reset_index: false

  - name: Process patrol event details 
    id: process_patrol_events
    task: process_events_details 
    partial: 
      df: ${{ workflow.filter_patrol_info_events.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize patrol events
    id: normalize_patrols
    task: normalize_json_column
    partial:
      column: event_details
      df: ${{ workflow.process_patrol_events.return }}
      skip_if_not_exists: true 
      sort_columns: true 

  - name: Drop patrol column prefix
    id: drop_patrol_prefix 
    task: drop_column_prefix 
    partial: 
      df: ${{ workflow.normalize_patrols.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Persist events 
    id: persist_events 
    task: persist_df 
    partial: 
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      filename: patrol_events
      df: ${{ workflow.drop_patrol_prefix.return }}

  - name: Rename patrol information columns 
    id: rename_patrol_info
    task: map_columns
    partial:
      raise_if_not_found: true
      drop_columns: [
        # "time",
        # "event_type",
        # "event_category",
        # "reported_by",
        # "serial_number",
      ]
      retain_columns: []
      rename_columns: {
        "patrols":"patrol_id",
        "Participants":"participants",
        "Patrol Purpose":"patrol_purpose",
        "Transport Type":"transport_type"
      }

      df: ${{ workflow.drop_patrol_prefix.return }}

  - name: Patrol information Summary
    id: patrol_info_summary
    task: summarize_df
    partial:
      groupby_cols:
        - patrol_purpose
      summary_params:
        - display_name: number_of_patrols
          aggregator: nunique 
          column: id 
          original_unit: null 
          new_unit: null 
          decimal_places: 0
      reset_index: true
      df: ${{ workflow.rename_patrol_info.return }}

  - name: Persist patrol summary table 
    id: persist_patrol_df
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      filename: patrol_purpose_summary
      df: ${{ workflow.patrol_info_summary.return }}

  - name: Draw patrol purpose summary table
    id: patrol_summary_table_html
    task: draw_table
    partial:
      dataframe: ${{ workflow.patrol_info_summary.return }}
      columns: null
      table_config: {enable_sorting: true, enable_filtering: true, enable_download: false, hide_header: false}
      widget_id: "Patrol Purpose Summary"

  - name: Save patrol purpose summary table (HTML)
    id: patrol_summary_table_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.patrol_summary_table_html.return }}
      filename: patrol_purpose_summary_table.html

  - name: Create patrol purpose summary table widget
    id: patrol_summary_table_widget
    task: create_table_widget_single_view
    partial:
      title: "Patrol Purpose Summary"
      data: ${{ workflow.patrol_summary_table_url.return }}

  # patrol observations
  - name: Filter null values from patrol id 
    id: filter_null_patrols
    task: filter_notna 
    partial: 
      df: ${{ workflow.rename_patrol_info.return }}
      column_names: ["patrol_id"]

  - name: Fill missing values in transport_type column 
    id: fill_transport_type 
    task: fill_missing_values 
    partial: 
      df: ${{ workflow.filter_null_patrols.return }}
      value: "Undefined"
      subset: ["transport_type"]

  - name: Explode patrol id values  
    id: explode_patrol_id 
    task: explode 
    partial: 
      df: ${{ workflow.fill_transport_type.return }}
      column_name: "patrol_id"
      ignore_index: true 

  - name: Get patrol values from events 
    id: get_patrol_event_values 
    task: get_patrol_values 
    partial: 
      events_df: ${{ workflow.explode_patrol_id.return }}
      patrols_column: patrol_id
      client: ${{ workflow.er_client_name.return }}
      max_workers: 10
  
  - name: Get patrol observations 
    id: get_patrol_obs 
    task: get_patrol_observations_from_patrols_df 
    partial: 
      client: ${{ workflow.er_client_name.return }}
      patrols_df: ${{ workflow.get_patrol_event_values.return }}
      include_patrol_details: true 
      raise_on_empty: true 
      sub_page_size: 100 

  - name: Join patrols df 
    id: join_patrol_df 
    task: map_columns
    partial: 
      df: ${{ workflow.explode_patrol_id.return }}
      drop_columns: []
      retain_columns: [
        "id",
        "patrol_id",
        "participants",
        "patrol_purpose",
        "transport_type"
        ]
      rename_columns: {}
      raise_if_not_found: false

  - name: Merge patrol events and patrol observations
    id: merge_patrol_df_obs 
    task: merge_two_dataframes 
    partial: 
      left: ${{ workflow.get_patrol_obs.return }}
      right: ${{ workflow.join_patrol_df.return }}
      on: "patrol_id"
      left_on: null
      right_on: null
      left_index: false
      right_index: false
      fillna_value:  null
      how: inner

  - name: Explode participants columns on observation   
    id: explode_participants 
    task: explode 
    partial: 
      df: ${{ workflow.merge_patrol_df_obs.return }}
      ignore_index: true 
      column_name: "participants"

  - name: Transform observations to relocations
    id: obs_relocs
    task: process_relocations
    partial:
      observations: ${{ workflow.explode_participants.return }}
      relocs_columns: [
        "extra__id",
        "extra__created_at",
        "extra__subject_id",
        "geometry",
        "groupby_col",
        "fixtime",
        "junk_status",
        "patrol_id",
        "patrol_title",
        "patrol_serial_number",
        "patrol_start_time",
        "patrol_end_time",
        "patrol_type",
        "patrol_status",
        "patrol_subject",
        "patrol_type__value",
        "participants",
        "patrol_purpose",
        "transport_type"
        ]
      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - name: Persist patrol relocations as geoparquet
    id: persist_relocs
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: geoparquet 
      filename: patrol_relocations
      df: ${{ workflow.obs_relocs.return }}


  - name: Filter foot patrol observations 
    id: filter_foot_patrols
    task: filter_df
    partial:
      column_name: transport_type
      op: equal
      value: Foot
      df:  ${{ workflow.obs_relocs.return }}
      reset_index: true

  - name: Filter vehicle patrol observations 
    id: filter_vehicle_patrols
    task: filter_df
    partial:
      column_name: transport_type
      op: equal
      value: Vehicle
      df:  ${{ workflow.obs_relocs.return }}
      reset_index: false

  - name: Filter motorbike patrol observations 
    id: filter_motor_patrols
    task: filter_df
    partial:
      column_name: transport_type
      op: equal
      value: Motorbike
      df:  ${{ workflow.obs_relocs.return }}
      reset_index: false


  - name: Convert vehicle relocations to trajectories
    id: vehicle_trajs
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.filter_vehicle_patrols.return }}
      trajectory_segment_filter:
        min_length_meters: 0.35
        max_length_meters: 5000.0
        max_time_secs: 18000.0
        min_time_secs: 1.0
        max_speed_kmhr: 100.0
        min_speed_kmhr: 10.0
      
  - name: Convert motorbike relocations to trajectories
    id: motor_trajs
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.filter_motor_patrols.return }}
      trajectory_segment_filter:
        min_length_meters: 0.35
        max_length_meters: 5000.0
        max_time_secs: 18000.0
        min_time_secs: 1.0
        max_speed_kmhr: 100.0
        min_speed_kmhr: 10.0

  - name: Convert foot relocations to trajectories
    id: foot_trajs
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.filter_foot_patrols.return }}
      trajectory_segment_filter:
        min_length_meters: 0.001
        max_length_meters: 5000.0
        max_time_secs: 14400.0
        min_time_secs: 1.0
        max_speed_kmhr: 9.0
        min_speed_kmhr: 0.5

  - name: Add temporal index to foot trajs
    id: temporal_foot_traj
    task: add_temporal_index
    partial:
      df: ${{ workflow.foot_trajs.return }}
      time_col: segment_start
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Add temporal index to vehicle trajs
    id: temporal_vehicle_traj
    task: add_temporal_index
    partial:
      df: ${{ workflow.vehicle_trajs.return }}
      time_col: segment_start
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Add temporal index to motorbike trajs
    id: temporal_motor_traj
    task: add_temporal_index
    partial:
      df: ${{ workflow.motor_trajs.return }}
      time_col: segment_start
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Rename foot traj columns
    id: rename_foot_trajs
    task: map_columns
    partial:
      raise_if_not_found: true
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "extra__created_at":"created_at",
        "extra__id":"id",
        "extra__participants":"participants",
        "extra__patrol_end_time":"patrol_end_time",
        "extra__patrol_id":"patrol_id",
        "extra__patrol_purpose":"patrol_purpose",
        "extra__patrol_serial_number":"patrol_serial_number",
        "extra__patrol_start_time":"patrol_start_time",
        "extra__patrol_status":"patrol_status",
        "extra__patrol_subject":"patrol_subject",
        "extra__patrol_title":"patrol_title",
        "extra__patrol_type":"patrol_type",
        "extra__patrol_type__value":"patrol_type_value",
        "extra__subject_id":"subject_id",
        "extra__transport_type":"transport_type"
